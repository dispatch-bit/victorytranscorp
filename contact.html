<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Victory Trans Corp.</title>
    <meta name="description" content="Contact Victory Trans Corp. for reliable transportation and dispatch support. Request a quote or ask about our freight services.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="brand">Victory Trans Corp.</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <section class="page-intro">
            <p class="eyebrow">Get in touch</p>
            <h1>Let’s talk about your shipping needs.</h1>
            <p class="lead">Tell us what you need and we’ll help you move freight with reliable communication and steady support.</p>
        </section>

        <div class="contact-layout">
            <aside class="contact-sidebar">
                <div class="info-box contact-card">
                    <h2>Contact Details</h2>
                    <ul class="contact-list">
                        <li>
                            <span>Email</span>
                            <a href="mailto:dispatch@victorytranscorp.com">dispatch@victorytranscorp.com</a>
                        </li>
                        <li>
                            <span>Phone</span>
                            <a href="tel:(919) 802-4829">(919) 802-4829</a>
                        </li>
                    </ul>
                </div>
            </aside>

            <form class="contact-form" data-contact-form action="https://formspree.io/f/xaeydqwe" method="POST">
                <input type="hidden" name="_subject" value="New inquiry from Victory Trans Corp website">
                <div class="field-row">
                    <div class="field-group">
                        <label for="full-name">Full Name</label>
                        <input id="full-name" name="fullName" type="text" placeholder="John Smith" required>
                    </div>

                    <div class="field-group">
                        <label for="company-name">Company</label>
                        <input id="company-name" name="company" type="text" placeholder="Your company name">
                    </div>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" placeholder="you@example.com" required>
                    </div>

                    <div class="field-group">
                        <label for="phone">Phone</label>
                        <input id="phone" name="phone" type="tel" placeholder="(123) 456-7890">
                    </div>
                </div>

                <div class="field-group">
                    <label for="message">How can we help?</label>
                    <textarea id="message" name="message" rows="6" placeholder="Tell us about your shipping needs, timeline, or route requirements." required></textarea>
                </div>

                <button type="submit" class="button">Send Request</button>
                <p class="form-status" aria-live="polite"></p>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
